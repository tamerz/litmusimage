name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build-redhat:
    uses: ./.github/workflows/template_build_deploy.yml
    with:
      image: redhat.*
      gated: false
    secrets: inherit
  build-almalinux:
    uses: ./.github/workflows/template_build_deploy.yml
    with:
      image: almalinux.*
      gated: false
    secrets: inherit
